name: Build SF19 WASM (Classic Worker Compatible)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smallnet

jobs:
  build-sf19:
    name: Build SF19 (${{ github.event.inputs.build_type || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout this repo (for build scripts)
        uses: actions/checkout@v4
        with:
          path: chess-ai-bot

      - name: Checkout Stockfish 19
        uses: actions/checkout@v4
        with:
          repository: official-stockfish/Stockfish
          ref: sf_19
          path: stockfish

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.70'
          actions-cache-folder: 'emsdk-cache'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3 make git

      - name: Copy glue.cpp and initModule.js to Stockfish src
        run: |
          cp chess-ai-bot/src/glue.cpp stockfish/src/
          cp chess-ai-bot/src/initModule.js stockfish/src/

      - name: Build SF19 (Full NNUE) - Classic Worker
        if: github.event.inputs.build_type != 'smallnet'
        run: |
          set -e
          cd stockfish
          
          # Find all source files (excluding platform-specific and nnue_embed)
          SRC_FILES=$(find src -name "*.cpp" \
            ! -path "src/universal/entry_*" \
            ! -name "nnue_embed.cpp" \
            ! -name "pyffish.cpp" \
            ! -name "ffishjs.cpp" \
            | tr '\n' ' ')
          
          echo "Found $(echo $SRC_FILES | wc -w) source files"
          
          # Build directory
          mkdir -p build
          cd build
          
          # CXX_FLAGS for compilation (each .cpp -> .o)
          CXX_FLAGS="-O3 -DNDEBUG --closure=1 -Isrc -pthread -msimd128 -mavx -flto -fno-exceptions \
            -DUSE_POPCNT -DUSE_SSE2 -DUSE_SSSE3 -DUSE_SSE41 -DNO_PREFETCH -DUSE_SLOPPY_ATOMICS \
            -DNNUE_EMBEDDING_OFF=0 -DNO_TABLEBASES \
            -DSTOCKFISH_WEB_SF_19"
          
          # LD_FLAGS for linking (.o files -> .js + .wasm)
          # Classic worker: MODULARIZE=1, EXPORT_NAME=Stockfish, NO EXPORT_ES6, USE_PTHREADS=0
          LD_FLAGS="-sENVIRONMENT=web,worker \
            --pre-js=../src/initModule.js \
            -sMODULARIZE=1 -sEXPORT_NAME=Stockfish \
            -sEXIT_RUNTIME=1 \
            -sEXPORTED_FUNCTIONS='[\"_malloc\",\"_free\",\"_main\",\"_uci\",\"_getRecommendedNnue\",\"_setNnueBuffer\"]' \
            -sEXPORTED_RUNTIME_METHODS='[\"stringToUTF8\",\"UTF8ToString\",\"HEAPU8\",\"lengthBytesUTF8\",\"_malloc\",\"_free\"]' \
            -sINCOMING_MODULE_JS_API='[\"locateFile\",\"print\",\"printErr\",\"wasmMemory\",\"buffer\",\"instantiateWasm\",\"mainScriptUrlOrBlob\",\"onExit\"]' \
            -sINITIAL_MEMORY=64MB -sALLOW_MEMORY_GROWTH=1 -sSTACK_SIZE=3MB -sSTRICT=1 \
            -sUSE_PTHREADS=0 -sPROXY_TO_PTHREAD=0 \
            -sALLOW_BLOCKING_ON_MAIN_THREAD=0 -Wno-pthreads-mem-growth \
            --closure=1"
          
          echo "=== Compiling source files ==="
          for src in $SRC_FILES; do
            obj="${src%.cpp}.o"
            echo "Compiling $src -> $obj"
            em++ $CXX_FLAGS -MMD -MP -c "../$src" -o "../$obj"
          done
          
          # Compile glue.cpp
          echo "Compiling glue.cpp -> glue.o"
          em++ $CXX_FLAGS -MMD -MP -c "../src/glue.cpp" -o "../src/glue.o"
          
          # Collect all object files
          OBJS=$(find ../src -name "*.o" | tr '\n' ' ')
          echo "=== Linking $(echo $OBJS | wc -w) object files ==="
          
          # Link everything into stockfish.js + stockfish.wasm
          em++ $CXX_FLAGS $LD_FLAGS $OBJS -o stockfish.js
          
          # Verify output
          if grep -q "EXPORT_ES6" stockfish.js; then
            echo "ERROR: EXPORT_ES6 found in output!"
            exit 1
          fi
          if [ ! -f stockfish.wasm ]; then
            echo "ERROR: stockfish.wasm not generated!"
            exit 1
          fi
          echo "SUCCESS: No EXPORT_ES6 found - classic worker compatible"
          ls -lh stockfish.js stockfish.wasm

      - name: Build SF19 (Smallnet) - Classic Worker
        if: github.event.inputs.build_type == 'smallnet'
        run: |
          set -e
          cd stockfish
          
          # Find all source files (excluding platform-specific and nnue_embed)
          SRC_FILES=$(find src -name "*.cpp" \
            ! -path "src/universal/entry_*" \
            ! -name "nnue_embed.cpp" \
            ! -name "pyffish.cpp" \
            ! -name "ffishjs.cpp" \
            | tr '\n' ' ')
          
          echo "Found $(echo $SRC_FILES | wc -w) source files"
          
          # Build directory
          mkdir -p build
          cd build
          
          # CXX_FLAGS for compilation (each .cpp -> .o) - smallnet has NNUE_EMBEDDING_OFF=1
          CXX_FLAGS="-O3 -DNDEBUG --closure=1 -Isrc -pthread -msimd128 -mavx -flto -fno-exceptions \
            -DUSE_POPCNT -DUSE_SSE2 -DUSE_SSSE3 -DUSE_SSE41 -DNO_PREFETCH -DUSE_SLOPPY_ATOMICS \
            -DNNUE_EMBEDDING_OFF=1 -DNO_TABLEBASES \
            -DSTOCKFISH_WEB_SF_19_SMALLNET"
          
          # LD_FLAGS for linking (.o files -> .js + .wasm)
          # Classic worker: MODULARIZE=1, EXPORT_NAME=Stockfish, NO EXPORT_ES6, USE_PTHREADS=0
          LD_FLAGS="-sENVIRONMENT=web,worker \
            --pre-js=../src/initModule.js \
            -sMODULARIZE=1 -sEXPORT_NAME=Stockfish \
            -sEXIT_RUNTIME=1 \
            -sEXPORTED_FUNCTIONS='[\"_malloc\",\"_free\",\"_main\",\"_uci\",\"_getRecommendedNnue\",\"_setNnueBuffer\"]' \
            -sEXPORTED_RUNTIME_METHODS='[\"stringToUTF8\",\"UTF8ToString\",\"HEAPU8\",\"lengthBytesUTF8\",\"_malloc\",\"_free\"]' \
            -sINCOMING_MODULE_JS_API='[\"locateFile\",\"print\",\"printErr\",\"wasmMemory\",\"buffer\",\"instantiateWasm\",\"mainScriptUrlOrBlob\",\"onExit\"]' \
            -sINITIAL_MEMORY=64MB -sALLOW_MEMORY_GROWTH=1 -sSTACK_SIZE=3MB -sSTRICT=1 \
            -sUSE_PTHREADS=0 -sPROXY_TO_PTHREAD=0 \
            -sALLOW_BLOCKING_ON_MAIN_THREAD=0 -Wno-pthreads-mem-growth \
            --closure=1"
          
          echo "=== Compiling source files ==="
          for src in $SRC_FILES; do
            obj="${src%.cpp}.o"
            echo "Compiling $src -> $obj"
            em++ $CXX_FLAGS -MMD -MP -c "../$src" -o "../$obj"
          done
          
          # Compile glue.cpp
          echo "Compiling glue.cpp -> glue.o"
          em++ $CXX_FLAGS -MMD -MP -c "../src/glue.cpp" -o "../src/glue.o"
          
          # Collect all object files
          OBJS=$(find ../src -name "*.o" | tr '\n' ' ')
          echo "=== Linking $(echo $OBJS | wc -w) object files ==="
          
          # Link everything into stockfish.js + stockfish.wasm
          em++ $CXX_FLAGS $LD_FLAGS $OBJS -o stockfish.js
          
          # Verify output
          if grep -q "EXPORT_ES6" stockfish.js; then
            echo "ERROR: EXPORT_ES6 found in output!"
            exit 1
          fi
          if [ ! -f stockfish.wasm ]; then
            echo "ERROR: stockfish.wasm not generated!"
            exit 1
          fi
          echo "SUCCESS: No EXPORT_ES6 found - classic worker compatible"
          ls -lh stockfish.js stockfish.wasm

      - name: Prepare artifact files
        run: |
          cd stockfish/build
          # Copy worker wrapper and preamble from our repo
          cp ../../chess-ai-bot/stockfish.worker.js .
          cp ../../chess-ai-bot/preamble.js .

      - name: Upload Full Build Artifacts
        if: github.event.inputs.build_type != 'smallnet'
        uses: actions/upload-artifact@v4
        with:
          name: sf19-full
          path: |
            stockfish/build/stockfish.js
            stockfish/build/stockfish.wasm
            stockfish/build/stockfish.worker.js
            stockfish/build/preamble.js
          retention-days: 30

      - name: Upload Smallnet Build Artifacts
        if: github.event.inputs.build_type == 'smallnet'
        uses: actions/upload-artifact@v4
        with:
          name: sf19-smallnet
          path: |
            stockfish/build/stockfish.js
            stockfish/build/stockfish.wasm
            stockfish/build/stockfish.worker.js
            stockfish/build/preamble.js
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            stockfish/build/stockfish.js
            stockfish/build/stockfish.wasm
            stockfish/build/stockfish.worker.js
            stockfish/build/preamble.js
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-build:
    name: Test Build
    runs-on: ubuntu-latest
    needs: build-sf19
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sf19-full
          path: ./sf19-test

      - name: Verify files
        run: |
          ls -la sf19-test/
          file sf19-test/stockfish.wasm
          head -50 sf19-test/stockfish.js

      - name: Verify no EXPORT_ES6
        run: |
          if grep -q "EXPORT_ES6" sf19-test/stockfish.js; then
            echo "ERROR: EXPORT_ES6 found in output!"
            exit 1
          else
            echo "OK: No EXPORT_ES6 found - classic worker compatible"
          fi
          
          # Check for export statements
          if grep -q "export " sf19-test/stockfish.js; then
            echo "WARNING: export statements found!"
          else
            echo "OK: No export statements found"
          fi