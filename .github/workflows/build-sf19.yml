name: Build SF19 WASM (Classic Worker Compatible)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smallnet

jobs:
  build-sf19:
    name: Build SF19 (${{ github.event.inputs.build_type || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout this repo (for build scripts)
        uses: actions/checkout@v4
        with:
          path: chess-ai-bot

      - name: Checkout Stockfish 19
        uses: actions/checkout@v4
        with:
          repository: official-stockfish/Stockfish
          ref: sf_19
          path: stockfish

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.70'
          actions-cache-folder: 'emsdk-cache'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3 make git

      - name: Build SF19 (Full NNUE) - Classic Worker
        if: github.event.inputs.build_type != 'smallnet'
        run: |
          set -e
          cd stockfish
          
          # Find all source files
          SRC_FILES=$(find src -name "*.cpp" | tr '\n' ' ')
          echo "Compiling $(echo $SRC_FILES | wc -w) source files..."
          
          # Common emcc flags for classic worker (NO EXPORT_ES6)
          EMCC_FLAGS=(
            -O3 -DNDEBUG -flto
            -msimd128 -msse -msse2 -mssse3 -msse4.1
            -DNNUE_EMBEDDING_OFF=0
            -DUSE_POPCNT -DNO_PREFETCH -DIS_64BIT -DNO_TABLEBASES -DNO_SYZYGY
            -s MODULARIZE=1
            -s EXPORT_NAME=Stockfish
            -s ENVIRONMENT=web,worker
            -s USE_PTHREADS=0
            -s EXIT_RUNTIME=0
            -s ALLOW_MEMORY_GROWTH=1
            -s INITIAL_MEMORY=128MB
            -s MAXIMUM_MEMORY=1024MB
            -s STACK_SIZE=5MB
            -s FILESYSTEM=0
            -s STRICT=1
            -s ASSERTIONS=0
            --closure=1
            -s EXPORTED_FUNCTIONS='["_malloc","_free","_main"]'
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","stringToUTF8","UTF8ToString","HEAPU8"]'
            --pre-js ../chess-ai-bot/preamble.js
            --extern-pre-js ../chess-ai-bot/extern-pre.js
            --extern-post-js ../chess-ai-bot/extern-post.js
            -o stockfish.js
          )
          
          em++ "${EMCC_FLAGS[@]}" $SRC_FILES 2>&1 | tee build.log
          
          # Verify
          if grep -q "EXPORT_ES6" stockfish.js; then
            echo "ERROR: EXPORT_ES6 found in output!"
            exit 1
          fi
          if [ ! -f stockfish.wasm ]; then
            echo "ERROR: stockfish.wasm not generated!"
            exit 1
          fi
          echo "SUCCESS: No EXPORT_ES6 found - classic worker compatible"
          ls -lh stockfish.js stockfish.wasm

      - name: Build SF19 (Smallnet) - Classic Worker
        if: github.event.inputs.build_type == 'smallnet'
        run: |
          set -e
          cd stockfish
          
          # Find all source files
          SRC_FILES=$(find src -name "*.cpp" | tr '\n' ' ')
          echo "Compiling $(echo $SRC_FILES | wc -w) source files..."
          
          # Common emcc flags for classic worker (NO EXPORT_ES6) - smallnet
          EMCC_FLAGS=(
            -O3 -DNDEBUG -flto
            -msimd128 -msse -msse2 -mssse3 -msse4.1
            -DNNUE_EMBEDDING_OFF=1
            -DUSE_POPCNT -DNO_PREFETCH -DIS_64BIT -DNO_TABLEBASES -DNO_SYZYGY
            -s MODULARIZE=1
            -s EXPORT_NAME=Stockfish
            -s ENVIRONMENT=web,worker
            -s USE_PTHREADS=0
            -s EXIT_RUNTIME=0
            -s ALLOW_MEMORY_GROWTH=1
            -s INITIAL_MEMORY=128MB
            -s MAXIMUM_MEMORY=1024MB
            -s STACK_SIZE=5MB
            -s FILESYSTEM=0
            -s STRICT=1
            -s ASSERTIONS=0
            --closure=1
            -s EXPORTED_FUNCTIONS='["_malloc","_free","_main"]'
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","stringToUTF8","UTF8ToString","HEAPU8"]'
            --pre-js ../chess-ai-bot/preamble.js
            --extern-pre-js ../chess-ai-bot/extern-pre.js
            --extern-post-js ../chess-ai-bot/extern-post.js
            -o stockfish.js
          )
          
          em++ "${EMCC_FLAGS[@]}" $SRC_FILES 2>&1 | tee build.log
          
          # Verify
          if grep -q "EXPORT_ES6" stockfish.js; then
            echo "ERROR: EXPORT_ES6 found in output!"
            exit 1
          fi
          if [ ! -f stockfish.wasm ]; then
            echo "ERROR: stockfish.wasm not generated!"
            exit 1
          fi
          echo "SUCCESS: No EXPORT_ES6 found - classic worker compatible"
          ls -lh stockfish.js stockfish.wasm

      - name: Prepare artifact files
        run: |
          cd stockfish
          # Copy worker wrapper and preamble from our repo
          cp ../chess-ai-bot/stockfish.worker.js .
          cp ../chess-ai-bot/preamble.js .

      - name: Upload Full Build Artifacts
        if: github.event.inputs.build_type != 'smallnet'
        uses: actions/upload-artifact@v4
        with:
          name: sf19-full
          path: |
            stockfish/stockfish.js
            stockfish/stockfish.wasm
            stockfish/stockfish.worker.js
            stockfish/preamble.js
          retention-days: 30

      - name: Upload Smallnet Build Artifacts
        if: github.event.inputs.build_type == 'smallnet'
        uses: actions/upload-artifact@v4
        with:
          name: sf19-smallnet
          path: |
            stockfish/stockfish.js
            stockfish/stockfish.wasm
            stockfish/stockfish.worker.js
            stockfish/preamble.js
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            stockfish/stockfish.js
            stockfish/stockfish.wasm
            stockfish/stockfish.worker.js
            stockfish/preamble.js
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-build:
    name: Test Build
    runs-on: ubuntu-latest
    needs: build-sf19
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sf19-full
          path: ./sf19-test

      - name: Verify files
        run: |
          ls -la sf19-test/
          file sf19-test/stockfish.wasm
          head -50 sf19-test/stockfish.js

      - name: Verify no EXPORT_ES6
        run: |
          if grep -q "EXPORT_ES6" sf19-test/stockfish.js; then
            echo "ERROR: EXPORT_ES6 found in output!"
            exit 1
          else
            echo "OK: No EXPORT_ES6 found - classic worker compatible"
          fi
          
          # Check for export statements
          if grep -q "export " sf19-test/stockfish.js; then
            echo "WARNING: export statements found!"
          else
            echo "OK: No export statements found"
          fi