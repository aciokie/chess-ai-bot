<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="knightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#d0d0d0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#0099ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2"/>
  
  <!-- Subtle pattern background -->
  <g opacity="0.08">
    <rect x="8" y="8" width="112" height="112" fill="url(#accentGrad)"/>
    <rect x="20" y="20" width="88" height="88" fill="url(#knightGrad)"/>
  </g>
  
  <!-- Chess board pattern hint -->
  <g fill="url(#accentGrad)" opacity="0.15">
    <rect x="24" y="24" width="12" height="12"/>
    <rect x="48" y="24" width="12" height="12"/>
    <rect x="72" y="24" width="12" height="12"/>
    <rect x="96" y="24" width="12" height="12"/>
    <rect x="36" y="36" width="12" height="12"/>
    <rect x="60" y="36" width="12" height="12"/>
    <rect x="84" y="36" width="12" height="12"/>
    <rect x="108" y="36" width="12" height="12"/>
  </g>
  
  <!-- Knight (white) - simplified but recognizable -->
  <g transform="translate(64, 58) scale(0.85)" filter="url(#glow)">
    <!-- Knight base -->
    <path d="M0 25 L-12 15 Q-18 10 -15 0 Q-12 -10 -8 -15 L8 -15 Q12 -10 15 0 Q18 10 12 15 L0 25 Z" 
          fill="url(#knightGrad)" stroke="#2a2a2a" stroke-width="1.5"/>
    
    <!-- Knight mane -->
    <path d="M-10 -5 Q-15 -8 -12 -12 Q-8 -15 -4 -12 Q-2 -10 -4 -5 Q-6 -2 -4 0 Q-8 2 -6 5" 
          fill="#e8e8e8" opacity="0.9"/>
    <path d="M10 -5 Q15 -8 12 -12 Q8 -15 4 -12 Q2 -10 4 -5 Q6 -2 4 0 Q8 2 6 5" 
          fill="#e8e8e8" opacity="0.9"/>
    
    <!-- Knight face details -->
    <ellipse cx="-5" cy="-3" rx="2" ry="1.5" fill="#1a1a2e"/>
    <ellipse cx="5" cy="-3" rx="2" ry="1.5" fill="#1a1a2e"/>
    
    <!-- Nostrils -->
    <circle cx="-2" cy="8" r="1.2" fill="#2a2a2a"/>
    <circle cx="2" cy="8" r="1.2" fill="#2a2a2a"/>
    
    <!-- AI circuit pattern on knight's neck -->
    <g stroke="url(#accentGrad)" stroke-width="1" fill="none" opacity="0.8">
      <path d="M-8 18 L-4 22 M-4 18 L-8 22"/>
      <path d="M8 18 L4 22 M4 18 L8 22"/>
      <line x1="-6" y1="24" x2="6" y2="24"/>
      <circle cx="0" cy="24" r="2"/>
    </g>
  </g>
  
  <!-- AI brain/core at center bottom -->
  <g transform="translate(64, 100)" filter="url(#glow)">
    <circle cx="0" cy="0" r="14" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2"/>
    <g fill="url(#accentGrad)">
      <circle cx="-5" cy="-3" r="2"/>
      <circle cx="5" cy="-3" r="2"/>
      <circle cx="-5" cy="3" r="2"/>
      <circle cx="5" cy="3" r="2"/>
      <circle cx="0" cy="0" r="2.5"/>
    </g>
    <!-- Neural connections -->
    <g stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.7">
      <line x1="-5" y1="-3" x2="0" y2="0"/>
      <line x1="5" y1="-3" x2="0" y2="0"/>
      <line x1="-5" y1="3" x2="0" y2="0"/>
      <line x1="5" y1="3" x2="0" y2="0"/>
      <line x1="-5" y1="-3" x2="5" y2="-3"/>
      <line x1="-5" y1="3" x2="5" y2="3"/>
    </g>
  </g>
  
  <!-- Subtle "AI" text -->
  <text x="64" y="122" font-family="system-ui, sans-serif" font-size="9" font-weight="700" 
        fill="url(#accentGrad)" text-anchor="middle" letter-spacing="1.5" opacity="0.6">AI</text>
</svg>